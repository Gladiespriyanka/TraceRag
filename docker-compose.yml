services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tracerag-postgres
    environment:
      POSTGRES_USER: tracerag
      POSTGRES_PASSWORD: tracerag
      POSTGRES_DB: tracerag
    ports: ["5432:5432"]
    volumes: [tracerag_postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    container_name: tracerag-redis
    ports: ["6379:6379"]
volumes:
  tracerag_postgres:
