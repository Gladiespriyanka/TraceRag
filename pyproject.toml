[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"
[project]
name="tracerag"
version="1.0.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115","uvicorn[standard]>=0.30","python-multipart>=0.0.9","pydantic-settings>=2.4","sqlalchemy>=2.0","asyncpg>=0.29","pgvector>=0.3","sentence-transformers>=3.0","pypdf>=5.0","redis>=5.0","google-genai>=1.0","httpx>=0.27"]
[project.optional-dependencies]
dev=["pytest>=8","pytest-asyncio>=0.23","ruff>=0.6"]
[tool.setuptools.packages.find]
include=["apps*","packages*","services*"]
