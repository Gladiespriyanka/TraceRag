services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tracerag
      POSTGRES_PASSWORD: tracerag
      POSTGRES_DB: tracerag
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tracerag:tracerag@postgres:5432/tracerag
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  web:
    build: ./apps/web
    ports: ["5173:80"]
    depends_on: [api]
